# Does this repo's code still pass its own tests?
#
# Deliberately PINNED, and that is the whole difference from rulebook-freshness.
# This job clones the rulebook at the revision `source.lock` records, so it
# tests *this repo's code* against a fixed input. Upstream churn can never
# redden a pull request here. The unpinned counterpart -- "has upstream moved
# in a way that reaches the library?" -- is rulebook-freshness.yml's job, and
# keeping those two questions in separate workflows is the point.
#
# It runs ALL THREE suites. `flutter test` matters as much as the Python one:
# the generated asset is verified on the Dart side, and a regression that
# emptied `selectedModifiers` would pass every Python test while only the Dart
# assertion caught it. The `integration` job below is the third, and it is
# here because `flutter test` does NOT run `integration_test/` -- those need a
# device, so before this job existed the end-to-end suite ran only when
# someone remembered to run it by hand, and rotted silently in between (see
# .superpowers/todo.md item 6).
name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger, so this job can be exercised from any branch without
  # opening a pull request first. Debugging a workflow that only runs on
  # push-to-main or on a PR otherwise costs a commit cycle per attempt.
  workflow_dispatch:

# A new push to a PR supersedes the previous run.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned rulebook revision from source.lock
        id: lock
        run: |
          sha=$(python3 -c "
          from scripts.spell_import import provenance
          print(provenance.pinned_revision(provenance.load()) or '')
          ")
          if [ -z "$sha" ]; then
            echo "::error::no book in source.lock records a rulebook revision, so this job cannot pin its input. The lock was probably written where the rulebook was not a git checkout; re-run --write --accept-source somewhere it is."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Pinning rulebook to $sha"

      - name: Restore the pinned rulebook from cache
        id: cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/rulebook
          key: rulebook-${{ steps.lock.outputs.sha }}

      # A blobless clone, because the lock records an ABBREVIATED sha and the
      # git wire protocol cannot fetch one: `git fetch origin 97cc62d` fails
      # with "couldn't find remote ref". Cloning the commit graph first and
      # resolving the short sha locally is what makes the pin work at all.
      # blob:none keeps that cheap -- the history's blobs are never fetched,
      # only the ones the pinned tree actually needs.
      - name: Clone the rulebook at the pinned revision
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --filter=blob:none --quiet \
            https://github.com/OriginalMadman/Ars-Magica-Open-License.git \
            "${{ runner.temp }}/rulebook"
          git -C "${{ runner.temp }}/rulebook" checkout --quiet "${{ steps.lock.outputs.sha }}"

      # Guards the cache as much as the clone: a cache entry restored under the
      # right key but holding the wrong tree would silently unpin this job.
      - name: Confirm the rulebook is at the pinned revision
        run: |
          actual=$(git -C "${{ runner.temp }}/rulebook" rev-parse --short HEAD)
          expected="${{ steps.lock.outputs.sha }}"
          if [ "$actual" != "$expected" ]; then
            echo "::error::rulebook is at $actual but source.lock pins $expected"
            exit 1
          fi
          echo "Rulebook at $actual, as pinned."

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Import harness suite
        env:
          ARS_RULEBOOK_ROOT: ${{ runner.temp }}/rulebook
        run: python -m unittest discover -s scripts/spell_import/tests -t .

      - name: Check the todo tree's structural invariants
        run: python -m scripts.todo.check

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - run: flutter pub get

      # Fails the build on any analyzer error or warning (not just infos), so
      # lint debt like an unused import can't land unnoticed the way it did
      # partway through the 2026-08-09 spell-invariant-enforcement branch --
      # see .superpowers/todo.md item 40's final-review recommendation 4.
      - name: Flutter analyze
        run: flutter analyze

      # No ARS_RULEBOOK_ROOT here on purpose: the Dart tests read the committed
      # assets, never the rulebook. Setting it would imply a dependency that
      # does not exist.
      - name: Flutter suite
        run: flutter test

  # `integration_test/` drives the real app against real Blocs and a real
  # database, which is the coverage the widget tests cannot reach: a mocked
  # Bloc emits no new state, so a rebuild-after-interaction bug (the
  # add-requisite `DropdownButtonFormField` crash) stays invisible to them.
  #
  # A SEPARATE JOB, on WINDOWS, for two reasons worth keeping:
  #  - It needs a device, so it needs a desktop runner -- a different OS from
  #    the `tests` job, which is what makes it a job and not another step.
  #  - `windows-latest` is the only configuration this suite has ever run in
  #    (`-d windows`, 8 of 8 green). `linux/` desktop support does exist in
  #    this repo, and moving here would be cheaper in runner minutes, but it
  #    has never been exercised and would need the GTK toolchain plus xvfb.
  #    Switching is a deliberate experiment, not a tidy-up -- do it on a branch
  #    and watch it go green before trusting it.
  #
  # No rulebook pin here either, and for the same reason as the Flutter suite
  # above: this reads the committed assets, never the rulebook.
  integration:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.8"
          channel: stable
          cache: true

      - run: flutter pub get

      # Defensive: desktop support is on by default in this Flutter version,
      # but an explicit enable costs nothing and turns a confusing "no devices
      # found" into a non-event.
      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Integration suite
        run: flutter test integration_test -d windows
